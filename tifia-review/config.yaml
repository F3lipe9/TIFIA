paths:
  templates_dir: data/templates
  agreements_dir: data/agreements
  manifest: data/manifest.csv
  gold_dir: data/gold
  outputs_dir: outputs
  cache_db: outputs/cache.sqlite

loader:
  scanned_page_min_chars: 50   # page with fewer chars gets needs_review
  max_low_text_fraction: 0.25  # more low-text pages than this -> is_scanned True

pipeline:
  # template for a manifest row with an empty `template` column. The 2021 agreements
  # predate the 2023 templates and are tax-backed: the non-project template may fit better.
  default_template: tla_template_2023_public_project_revenue

segmentation:
  recovery:                     # find sections whose "Section N." was lost (Section_Recovery.md)
    enabled: true
    min_text_coverage: 0.98     # section text / body text after the TOC; below: degraded
    toc_search_fraction: 0.10   # look for the TOC in the first 10% of pages (at least 10)
    toc_min_entries_ratio: 0.80 # TOC with fewer entries than this x the template's
                                # sections: recover with the template's titles instead

aligner:
  similarity_threshold: 0.80   # embedding fallback cutoff
  embedding_model: sentence-transformers/all-MiniLM-L6-v2

llm:
  provider: anthropic          # provider class in llm/client.py
  model: claude-sonnet-5-5     # no temperature setting: current Claude models reject it
  api_key_env: LLM_API_KEY     # set in .env; without it the SDK uses ANTHROPIC_API_KEY
  effort: medium               # low | medium | high (model default); thinking is adaptive
  max_tokens: 16000            # per reply, thinking included
  batch_size: 15               # deviations per call (10-20)
  max_batch_chars: 40000       # ... and about this much deviation JSON at most per call
  max_retries: 1               # a label that fails a check is sent once more
  max_workers: 3               # requests in flight at once; raise to 4-8 only if no 429s
  api_retries: 6               # SDK retries per request on 429/5xx, with backoff
  price_per_mtok:              # USD for the model above, for the cost log
    input: 2.00
    output: 10.00
    cache_write: 2.50          # 5-minute prompt cache
    cache_read: 0.20
  budget_usd: 300

# DRAFT: finalize names and definitions with the advisor (docs/taxonomy-draft.md).
# "unclear" is always allowed. Changing any of this invalidates cached labels.
taxonomy:
  Definitions: >-
    A defined term was added, removed or redefined, in Section 1 or wherever the term is
    defined. A changed definition changes every provision that uses the term.
  Payment terms: >-
    The loan amount, interest rate, disbursements, payment dates, amortization,
    prepayment and fees, and the security, pledged revenues and flow of funds that repay
    the loan.
  Conditions precedent: >-
    What must happen before the agreement takes effect or before a disbursement,
    including documents, certificates and legal opinions to be delivered.
  Covenants: >-
    What the borrower must or must not do while the loan is outstanding: affirmative and
    negative covenants, including reporting, notices, insurance, accounts, additional
    debt and compliance with federal requirements.
  Events of default: >-
    Events of default, cure periods, remedies, acceleration and the lender's rights after
    a default.
  Other: >-
    Anything else, including representations and warranties, general provisions
    (notices, governing law, amendments, counterparts) and forms in the exhibits.

# DRAFT definition of a substantive change, for the advisor to confirm.
substantive: >-
  A change is substantive if it changes what a party must do, may do or will receive: an
  obligation, right, condition, deadline, amount, rate, threshold or remedy, or the scope
  of a defined term. Changes that leave the meaning the same are not substantive:
  wording, style, punctuation, cross-references and numbering.

# Two-page executive summary (Summary_Report.md v2), made with every report. Sections are
# the 2023 project-revenue template's; the agreement's matching sections are found through
# the alignment. "recitals" = the preamble; "1:<term>" = that definition. A deviation
# counts for a topic if its template section (or a parent) is listed; a definition only
# through "1:<term>" or state_law_definitions. Changing a topic's ask or sections reruns
# that row's LLM call; the rest stay cached.
summary:
  enabled: true
  max_pages: 2
  max_excerpt_chars: 60000     # per topic, sent to the LLM
  loan_amount_section: "3"     # for the Exhibit G principal cross-check
  # ranking of "other significant changes"; set at the taxonomy meeting (default: taxonomy order)
  category_priority: [Payment terms, Events of default, Covenants, Conditions precedent,
                      Definitions, Other]
  other_significant_changes: {top_n: 3}
  topics:
    project:
      label: The project
      sections: [recitals, "1:Project"]
      ask: What is being built or financed, in one or two lines.
    borrowing_authority:
      label: Borrowing authority
      sections: ["12", "13"]       # sent to the LLM
      # counted as changes to this topic: Organization; Power and Authority, Officers'
      # Authorization, and the condition that the authorizing resolutions be delivered
      count_sections: ["13(a)", "13(b)", "12(a)(xix)"]
      state_law_definitions: true  # the borrower's enabling act, whatever it is called
      ask: >-
        (a) The state law that lets the borrower borrow and pledge its revenues, and (b) the
        resolution or other action that authorizes this loan. Say if either is not stated.
    loan_amount:
      label: Loan amount
      sections: [recitals, "3"]
      ask: The maximum principal amount of the TIFIA loan, and whether capitalized interest is excluded.
    interest_rate:
      label: Interest rate
      sections: ["6"]
      ask: The interest rate and how it is set; the default rate if stated.
    payment_schedule:
      label: Payment schedule
      sections: ["5", "7", "9", "10", "1:Final Maturity Date",
                 "1:Debt Service Payment Commencement Date", "1:Semi-Annual Payment Date"]
      ask: How often payments are due, when repayment of principal starts, and the final maturity date.
    default_remedies:
      label: Events of default and remedies
      sections: ["19"]
      ask: The main events of default (two or three, briefly) and what the lender can do.
    accounting_audit:
      label: Accounting and audit
      sections: ["20"]
      ask: What records, audits and inspection rights the agreement requires.
    oversight:
      label: Project oversight and monitoring
      sections: ["22"]
      ask: Who oversees the project and what the borrower must report.
    notices_termination:
      label: Notices and termination
      sections: ["36", "38"]
      ask: How formal notices are given, and when the agreement ends.

evaluation:
  match_text_overlap: 0.50     # min text overlap to match predicted vs gold
  target_recall: 0.90          # proposal, set with advisor before week 8
  target_precision: 0.70
  threshold_agreed: ""         # who agreed the targets, when, where it is written down
  holdout: []                  # doc_ids not looked at in week 9; score once with --holdout
